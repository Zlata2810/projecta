<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101115">
  <link rel="stylesheet" href="styles.css">
  <title>Що в голові у ШІ? — Нейронна мережа</title>
  <script src="main.js" defer></script>
  <script src="network.js" defer></script>
</head>
<body>
  <header id="site-header"></header>
  <main>
    <section class="network-hero" aria-labelledby="page-title">
      <p class="eyebrow"><span class="status-dot"></span> ДОСЛІДЖУЄМО ШТУЧНИЙ ІНТЕЛЕКТ</p>
      <h1 id="page-title">Що в голові у <span>ШІ?</span></h1>
      <p class="network-intro">Зазирни всередину нейронної мережі — обери вузол, щоб дослідити тему.</p>
      <div class="network-panel">
        <div class="panel-label"><span>НЕЙРОННА МЕРЕЖА</span><span>● СИСТЕМА АКТИВНА</span></div>
        <svg id="net" viewBox="0 0 900 470" role="img" aria-label="Інтерактивна схема нейронної мережі"></svg>
        <p class="network-hint">Натисни на вузол мережі, щоб перейти далі <span>↗</span></p>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>
</body>
</html>
